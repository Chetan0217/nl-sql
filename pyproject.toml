[project]
name = "nlsql"
version = "0.2.0"
description = "Two-way translation between plain-language questions and SQL, grounded in a live schema"
requires-python = ">=3.10"
dependencies = ["sqlglot>=30", "sqlalchemy>=2.0", "anthropic>=1.15"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nlsql = "nlsql.cli:main"
nlsql-web = "nlsql.web.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nlsql", "nlsql.web"]

[tool.setuptools.package-data]
"nlsql.web" = ["static/*"]
